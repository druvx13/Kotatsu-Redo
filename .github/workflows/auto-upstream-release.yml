name: Auto Upstream Release Sync + Auto Build

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: git remote add upstream https://github.com/Kotatsu-Redo/Kotatsu-Redo.git

      - name: Fetch upstream (branches + tags)
        run: git fetch upstream --tags

      - name: Get latest upstream tag
        id: tag
        run: |
          latest_tag=$(git ls-remote --tags upstream \
            | sed 's|^.*refs/tags/||' \
            | sed 's|\^{}||' \
            | sort -V \
            | tail -n1)

          if [ -z "$latest_tag" ]; then
            echo "No tags found on upstream or remote fetch failed."
            echo "latest_tag=" >> $GITHUB_OUTPUT
          else
            echo "Latest upstream tag: $latest_tag"
            echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag already exists in fork
        if: steps.tag.outputs.latest_tag != ''
        id: tag-check
        run: |
          TAG_EXISTS=false
          if git rev-parse "refs/tags/${{ steps.tag.outputs.latest_tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.tag.outputs.latest_tag }} already exists in fork. Nothing to do."
            TAG_EXISTS=true
          fi
          echo "tag_exists=$TAG_EXISTS" >> $GITHUB_OUTPUT

      - name: Merge upstream devel into fork devel (keep constants.xml)
        if: steps.tag.outputs.latest_tag != '' && steps.tag-check.outputs.tag_exists == 'false'
        id: merge
        run: |
          # Checkout your devel branch (adjust if you use another branch)
          git checkout devel

          # Merge upstream/devel - use || true to prevent job failure on conflict
          git merge upstream/devel --no-commit --no-ff || true

          # Always keep your own constants.xml (Common Android resource file)
          CONSTANTS_FILE="app/src/main/res/values/constants.xml"
          if [ -f "$CONSTANTS_FILE" ]; then
            # Checkout the version from the local branch (ours)
            git checkout --ours "$CONSTANTS_FILE" || true
          fi

          # If nothing changed after merge (or only conflicts were resolved by --ours), abort merge and exit
          if git diff --quiet; then
            echo "No meaningful changes after merge; aborting."
            git merge --abort || true
            exit 0
          fi

          git commit -am "Auto-sync: upstream devel -> fork devel (constants.xml preserved)"
          echo "commit_created=true" >> $GITHUB_OUTPUT

      - name: Push sync commit to fork
        if: steps.tag.outputs.latest_tag != '' && steps.merge.outputs.commit_created == 'true'
        run: |
          git push origin devel

      - name: Create same tag in fork
        if: steps.tag.outputs.latest_tag != '' && steps.tag-check.outputs.tag_exists == 'false'
        run: |
          git tag "${{ steps.tag.outputs.latest_tag }}"
          git push origin "${{ steps.tag.outputs.latest_tag }}"

      - name: Done
        if: steps.tag.outputs.latest_tag != '' && steps.tag-check.outputs.tag_exists == 'false'
        run: echo "New tag and sync completed. The tag push should trigger an auto-build workflow."
