name: Auto Upstream Release Sync + Auto Build

on:
  schedule:
    - cron: "*/30 * * * *"   # check every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: git remote add upstream https://github.com/Kotatsu-Redo/Kotatsu-Redo.git

      - name: Fetch upstream (branches + tags)
        run: git fetch upstream --tags

      - name: Get latest upstream tag
        id: tag
        run: |
          latest_tag=$(git ls-remote --tags upstream \
            | sed 's|^.*refs/tags/||' \
            | sed 's|\^{}||' \
            | sort -V \
            | tail -n1)

          if [ -z "$latest_tag" ]; then
            echo "No tags found on upstream."
            echo "latest_tag=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Latest upstream tag: $latest_tag"
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Stop if no tag found
        if: steps.tag.outputs.latest_tag == ''
        run: echo "Nothing to do."

      - name: Check if tag already exists in fork
        if: steps.tag.outputs.latest_tag != ''
        run: |
          if git rev-parse "refs/tags/${{ steps.tag.outputs.latest_tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.tag.outputs.latest_tag }} already exists in fork. Nothing to do."
            exit 0
          fi

      - name: Merge upstream devel into fork devel (keep constants.xml)
        if: steps.tag.outputs.latest_tag != ''
        run: |
          # Checkout your devel branch (adjust if you use another branch)
          git checkout devel

          # Merge upstream/devel
          git merge upstream/devel --no-commit --no-ff || true

          # Always keep your own constants.xml
          if [ -f app/src/main/res/values/constants.xml ]; then
            git checkout --ours app/src/main/res/values/constants.xml || true
          fi

          # If nothing changed, abort merge and exit
          if git diff --quiet; then
            echo "No changes after merge; aborting."
            git merge --abort || true
            exit 0
          fi

          git commit -am "Auto-sync: upstream devel -> fork devel (constants.xml preserved)"

      - name: Push sync commit to fork
        if: steps.tag.outputs.latest_tag != ''
        run: |
          git push origin devel

      - name: Create same tag in fork
        if: steps.tag.outputs.latest_tag != ''
        run: |
          git tag "${{ steps.tag.outputs.latest_tag }}"
          git push origin "${{ steps.tag.outputs.latest_tag }}"

      - name: Done
        if: steps.tag.outputs.latest_tag != ''
        run: echo "Tag pushed; release workflow will build APK automatically."
