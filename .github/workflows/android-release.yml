name: Android Release APK (signed)

on:
  workflow_dispatch:
  push:
    branches:
      - devel    # change if your main branch is different

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Generate a throwaway release keystore ON THE RUNNER
      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -alias kotatsuKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password \
            -keypass password \
            -dname "CN=Kotatsu,O=Self,C=US" \
            -keystore kotatsu-release.keystore

      # Build a SIGNED release APK using that keystore
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/kotatsu-release.keystore \
            -Pandroid.injected.signing.store.password=password \
            -Pandroid.injected.signing.key.alias=kotatsuKey \
            -Pandroid.injected.signing.key.password=password

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: kotatsu-redo-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
