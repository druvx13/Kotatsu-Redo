name: Android Release APK (signed + publish)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      KEY_PASSWORD: "password123"
      STORE_PASSWORD: "password123"
      KEY_ALIAS: "kotatsuKey"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 🟢 SELF-HEALING KEY LOGIC 🟢
      - name: Ensure Keystore Exists
        run: |
          KEY_FILE="keystore.b64"

          # 1. First, check if the key is already in the current workspace (from tag)
          if [ -f "$KEY_FILE" ]; then
             echo "✅ Found key in current workspace."
          else
             echo "🔍 Key not in current tag. Checking 'devel' branch..."
             git fetch origin devel
             
             # 2. Try to checkout the key file directly from the remote devel branch
             # This avoids switching branches (which caused your crash) and just grabs the file.
             if git checkout origin/devel -- "$KEY_FILE" 2>/dev/null; then
                echo "✅ Key found in 'devel' and checked out for this build."
             else
                # 3. Only generate a new key if it is TRULY missing from both Tag and Devel
                echo "⚠️ Key NOT found in 'devel'. Generating new..."
                
                # Switch to devel FIRST to avoid checkout conflicts later
                git checkout devel

                keytool -genkeypair -v \
                  -keystore release.keystore \
                  -alias "${{ env.KEY_ALIAS }}" \
                  -keyalg RSA \
                  -keysize 2048 \
                  -validity 10000 \
                  -storepass "${{ env.STORE_PASSWORD }}" \
                  -keypass "${{ env.KEY_PASSWORD }}" \
                  -dname "CN=KotatsuUser, O=Personal, C=US"

                base64 release.keystore > "$KEY_FILE"

                echo "💾 Committing new key to 'devel' branch..."
                git config --global user.name "GitHub Actions"
                git config --global user.email "actions@github.com"
                
                git add "$KEY_FILE"
                git commit -m "chore: Auto-generate permanent signing key [skip ci]"
                git push origin devel
                
                echo "✅ Key saved to repo. Switching back to tag for build..."
                git checkout -
                
                # Restore the file we just created (switching branches might have hidden it)
                git checkout devel -- "$KEY_FILE"
             fi
          fi

          # 4. Final Decode
          echo "🔓 Decoding keystore..."
          base64 --decode "$KEY_FILE" > release.keystore

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password="${{ env.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ env.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ env.KEY_PASSWORD }}"

      - name: Archive APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotatsu-redo-signed-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
