name: Android Release APK (signed + publish)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      KEY_PASSWORD: "password123"
      STORE_PASSWORD: "password123"
      KEY_ALIAS: "kotatsuKey"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 🟢 SELF-HEALING KEY LOGIC 🟢
      - name: Ensure Keystore Exists
        run: |
          KEY_FILE="keystore.b64"

          # 1. If key is missing in the current tag, check if it exists in 'devel' (from a previous run)
          if [ ! -f "$KEY_FILE" ]; then
             echo "🔍 Key not found in current tag. Checking 'devel' branch..."
             git fetch origin devel
             
             # Try to checkout just the key file from the devel branch
             if git checkout origin/devel -- "$KEY_FILE" 2>/dev/null; then
                echo "✅ Key found in 'devel' and checked out for this build."
             else
                echo "⚠️ Key not found in 'devel' either."
             fi
          fi

          # 2. If we found the file (either locally or from devel), decode it.
          if [ -f "$KEY_FILE" ]; then
            echo "✅ Keystore file found. Decoding..."
            base64 --decode "$KEY_FILE" > release.keystore
          else
            # 3. Only Generate if it truly doesn't exist anywhere
            echo "⚠️ Keystore file NOT found. Generating a new permanent key..."
            
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "${{ env.KEY_ALIAS }}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ env.STORE_PASSWORD }}" \
              -keypass "${{ env.KEY_PASSWORD }}" \
              -dname "CN=KotatsuUser, O=Personal, C=US"

            base64 release.keystore > "$KEY_FILE"

            echo "💾 Committing new key to 'devel' branch..."
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            
            git fetch origin devel
            git checkout devel
            git add "$KEY_FILE"
            git commit -m "chore: Auto-generate permanent signing key [skip ci]" || echo "Nothing to commit"
            git push origin devel
            
            echo "✅ Key saved to repo. Switching back to tag for build..."
            git checkout -
            
            # CRITICAL FIX: Do NOT decode here. release.keystore already exists from the generation step.
            echo "✅ Using the newly generated release.keystore for this run."
          fi

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password="${{ env.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ env.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ env.KEY_PASSWORD }}"

      - name: Archive APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotatsu-redo-signed-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
